[package]
name = "loadtest"
version = "0.1.0"
edition = "2021"
description = "Drives N synthetic participants through a harmony SFU call"

[dependencies]
webrtc = "=0.17.3"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tokio-tungstenite = "=0.30.0"
futures-util = { version = "=0.3.34", default-features = false, features = ["sink"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "form"] }
bytes = "=1.12.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
