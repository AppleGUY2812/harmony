services:

  backend:
    image: binkybarnes/harmony-backend:latest
    environment:
      ROCKET_PORT: "5500"
      ROCKET_ADDRESS: "0.0.0.0"
      RUST_ENV: "production"
      ROCKET_DATABASES: "{harmony_db={url=\"postgresql://postgres:${POSTGRES_PASSWORD}@db:5432\"}}"
      JWT_SECRET: "${JWT_SECRET}"
      # AWS/CloudFront are optional: leave S3_IMAGE_BUCKET empty to store icons in UPLOAD_DIR
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_REGION: "${AWS_REGION:-}"
      S3_IMAGE_BUCKET: "${S3_IMAGE_BUCKET:-}"
      CLOUDFRONT_DOMAIN: "${CLOUDFRONT_DOMAIN:-}"
      CLOUDFRONT_KEY_PAIR_ID: "${CLOUDFRONT_KEY_PAIR_ID:-}"
      CLOUDFRONT_PRIVATE_KEY: "${CLOUDFRONT_PRIVATE_KEY:-}"
      UPLOAD_DIR: "/uploads"
      WEBRTC_UDP_PORT: "50000"
      # public IP clients reach the SFU on (127.0.0.1 for local docker)
      WEBRTC_PUBLIC_IP: "${WEBRTC_PUBLIC_IP}"
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      # localhost only: direct requests would skip nginx and could forge X-Real-IP
      - "127.0.0.1:5500:5500"
      - "50000:50000/udp"
    volumes:
      - uploads:/uploads
    depends_on:
      - db
  db:
    image: postgres:15.2-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db:/var/lib/postgresql/data
      - ./backend/init-db:/docker-entrypoint-initdb.d

  frontend:
    image: binkybarnes/harmony-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot/:ro
      - ./certbot/conf/:/etc/nginx/ssl/:ro
      # - ./ssl:/etc/ssl/certs

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/www/:/var/www/certbot/:rw
      - ./certbot/conf/:/etc/letsencrypt/:rw

volumes:
  db:
    driver: local
  uploads:
    driver: local
